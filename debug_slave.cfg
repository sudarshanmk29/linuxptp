#
# Software timestamping PTP Slave Configuration
# For debugging with virtual ethernet interfaces
#
[global]
# Clock identity and time source
clockClass		248
clockAccuracy		0xFE
offsetScaledLogVariance	0xFFFF
priority1		255
priority2		255
domainNumber		0

# Software timestamping support
time_stamping		software
transportSpecific	0

# Synchronization intervals
logAnnounceInterval	0
logSyncInterval		-3
logMinPdelayReqInterval	0
operLogSyncInterval	-3
operLogPdelayReqInterval	0

# Delays and timeouts
announceReceiptTimeout	3
syncReceiptTimeout	3
delay_response_timeout	0

# Servo and algorithm settings
freq_est_interval	1
delay_request_variability	1.0
delayAsymmetry		0

# Slave specific settings
clientOnly		1
inhibit_announce	1
inhibit_delay_req	0

# Network transport - using UDP for software timestamping
network_transport	UDPv4

# Delay mechanism
delay_mechanism		E2E

# Boundary clock
gmCapable		0
two_step_flag		1

# Debugging options
logging_level		6
verbose			1
use_syslog		0

# Path trace for debugging
path_trace_enabled	1
follow_up_info		1

# Servo offset settings for faster convergence during debugging
step_threshold		1000000000
max_frequency		900000000

# Allow some statistics tracking
stats_interval		0
