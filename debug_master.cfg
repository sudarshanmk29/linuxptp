#
# Software timestamping PTP Master Configuration
# For debugging with virtual ethernet interfaces
#
[global]
# Clock identity and time source
clockClass		6
clockAccuracy		0xFE
offsetScaledLogVariance	0xFFFF
priority1		128
priority2		128
domainNumber		0

# Software timestamping support
time_stamping		software
transportSpecific	0
 
# Synchronization intervals
logAnnounceInterval	0
logSyncInterval		-3
logMinPdelayReqInterval	0
operLogSyncInterval	-3
operLogPdelayReqInterval	0

# Delays and timeouts
announceReceiptTimeout	3
syncReceiptTimeout	0
delay_response_timeout	0

# Servo and algorithm settings
freq_est_interval	1
delay_request_variability	1.0
delayAsymmetry		0

# Master specific settings
serverOnly		1
inhibit_announce	0
inhibit_delay_req	0

# Network transport - using UDP for software timestamping
network_transport	UDPv4

# Delay mechanism
delay_mechanism		E2E

# Boundary clock
gmCapable		1
two_step_flag		1

# Debugging options
logging_level		6
verbose			1
use_syslog		0

# Path trace for debugging
path_trace_enabled	1
follow_up_info		1

# Allow some statistics tracking
stats_interval		0
